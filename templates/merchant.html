<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ store_name }} · POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #FBF7EC 0%, #F4E8CC 50%, #EAD6A8 100%);
    min-height: 100vh;
    background-attachment: fixed;
  }
  .glow { box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: glow 1.4s ease-out; }
  @keyframes glow { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)} 100%{box-shadow:0 0 0 24px rgba(34,197,94,0)} }
  .fade-in { animation: fade .25s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .check { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .55s ease forwards .15s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { 0%{transform:scale(.95)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<div class="max-w-6xl mx-auto p-6">

  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl text-white grid place-items-center font-black text-lg" style="background:linear-gradient(135deg,#8B5A2B,#5C3D2E);">C</div>
      <div>
        <div class="text-xs text-amber-800/70">가맹점 POS</div>
        <div class="text-xl font-bold text-stone-900">{{ store_name }}</div>
      </div>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <a href="/order-qr" target="_blank" class="px-3 py-2 rounded-lg bg-white/70 border border-amber-200 hover:bg-white text-stone-700">선주문 QR</a>
      <a href="/kitchen" target="_blank" class="px-3 py-2 rounded-lg bg-white/70 border border-amber-200 hover:bg-white text-stone-700">주방 화면</a>
      <a href="/admin" class="px-3 py-2 rounded-lg bg-white/70 border border-amber-200 hover:bg-white text-stone-700">결제 내역</a>
      <span class="px-3 py-2 rounded-lg text-white" style="background:linear-gradient(135deg,#8B5A2B,#5C3D2E);">상점 ID · {{ store_id }}</span>
    </div>
  </header>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- LEFT: 메뉴 + 주문 내역 -->
    <section class="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-sm border border-amber-200">
      <div class="text-sm font-bold text-amber-900 mb-3">메뉴</div>
      <div class="grid grid-cols-3 gap-2">
        {% for item in menu %}
        <button data-menu-id="{{ item.id }}" data-name="{{ item.name }}" data-price="{{ item.price }}"
                class="menu-card text-center p-3 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 active:scale-95 transition">
          <div class="text-2xl">{{ item.emoji }}</div>
          <div class="text-sm font-bold text-stone-800 mt-1 leading-tight">{{ item.name }}</div>
          <div class="text-xs font-semibold text-amber-800 mt-1">{{ "{:,}".format(item.price) }}원</div>
        </button>
        {% endfor %}
      </div>

      <!-- 주문 내역 (장바구니) -->
      <div class="mt-5 pt-4 border-t border-amber-100">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-bold text-amber-900">주문 내역</div>
          <button id="clearCart" class="text-xs px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100">비우기</button>
        </div>
        <div id="cartList" class="space-y-1 text-sm min-h-[80px]"></div>
        <div class="mt-3 pt-3 border-t border-amber-100 flex items-end justify-between">
          <div>
            <div class="text-xs text-stone-500">합계</div>
            <div class="text-4xl font-black text-stone-900 leading-none mt-1"><span id="totalAmount">0</span><span class="text-xl text-stone-400 ml-1">원</span></div>
          </div>
          <div class="text-xs text-stone-500"><span id="itemCount">0</span>개 항목</div>
        </div>
      </div>

      <button id="charge" disabled
              class="mt-5 w-full py-4 rounded-xl text-white text-lg font-bold hover:opacity-95 disabled:opacity-40 disabled:cursor-not-allowed transition"
              style="background:linear-gradient(135deg,#B45309 0%,#78350F 100%);">
        결제 요청 (QR 생성)
      </button>
      <div class="mt-3 text-xs text-amber-900/60 text-center">손님은 QR을 스캔해 결제 진행 · 시연 호스트: {{ lan_host }}</div>
    </section>

    <!-- RIGHT: QR / 결제 상태 -->
    <section class="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-sm border border-amber-200 flex flex-col">
      <div class="flex items-center justify-between mb-2">
        <div class="text-sm font-bold text-amber-900">결제 요청</div>
        <div id="statusBadge" class="text-xs px-2 py-1 rounded-full bg-stone-100 text-stone-500">대기</div>
      </div>

      <div id="emptyState" class="flex-1 grid place-items-center text-center text-amber-900/40 py-16">
        <div>
          <svg class="mx-auto w-14 h-14 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h-3zM18 18h3v3h-3zM15 21h6"/></svg>
          <div class="mt-3 text-sm">메뉴를 담은 뒤 <b>결제 요청</b>을 누르세요.</div>
        </div>
      </div>

      <div id="qrState" class="hidden flex-1 flex-col items-center justify-center text-center fade-in">
        <img id="qrImg" alt="QR" class="w-64 h-64 rounded-xl bg-amber-50 p-3 border border-amber-200" />
        <div class="mt-4 text-3xl font-black text-stone-900"><span id="qrAmount">0</span>원</div>
        <div class="text-sm text-stone-500 max-w-xs truncate" id="qrMemo"></div>
        <div class="mt-2 text-xs text-stone-400">주문번호 <span id="qrOrderId" class="font-mono"></span></div>
        <div class="mt-4 flex gap-2">
          <a id="openLink" target="_blank" class="text-xs px-3 py-2 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200">손님 화면 미리보기</a>
          <button id="cancelBtn" class="text-xs px-3 py-2 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200">취소</button>
        </div>
      </div>

      <div id="paidState" class="hidden flex-1 flex-col items-center justify-center text-center fade-in">
        <div class="w-28 h-28 rounded-full bg-emerald-100 grid place-items-center glow">
          <svg viewBox="0 0 24 24" class="w-16 h-16" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path class="check" d="M5 12l5 5L20 7"/>
          </svg>
        </div>
        <div class="mt-4 text-2xl font-black text-emerald-700">결제 완료</div>
        <div class="mt-1 text-4xl font-black text-stone-900"><span id="paidAmount">0</span>원</div>
        <div class="mt-1 text-sm text-stone-500">
          <span id="paidPayer">손님</span> · <span id="paidMethod">카드</span> · <span id="paidAt"></span>
        </div>
        <button id="newOrder" class="mt-6 px-5 py-3 rounded-xl text-white font-semibold hover:opacity-95" style="background:linear-gradient(135deg,#8B5A2B,#5C3D2E);">새 주문</button>
      </div>
    </section>
  </div>
</div>

<script>
const chargeBtn = document.getElementById('charge');
const emptyState = document.getElementById('emptyState');
const qrState = document.getElementById('qrState');
const paidState = document.getElementById('paidState');
const statusBadge = document.getElementById('statusBadge');

let cart = {}; // { menuId: qty }
let currentOrderId = null;
let ws = null;

function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

function menuInfo(id) {
  const btn = document.querySelector(`[data-menu-id="${id}"]`);
  return { name: btn.dataset.name, price: Number(btn.dataset.price) };
}

function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => sum + menuInfo(id).price * qty, 0);
}

function cartMemo() {
  return Object.entries(cart)
    .filter(([_, q]) => q > 0)
    .map(([id, q]) => `${menuInfo(id).name} x${q}`)
    .join(', ');
}

function cartItemCount() {
  return Object.values(cart).reduce((s, q) => s + q, 0);
}

function renderCart() {
  const list = document.getElementById('cartList');
  const entries = Object.entries(cart).filter(([_, q]) => q > 0);
  if (entries.length === 0) {
    list.innerHTML = '<div class="text-stone-400 text-center py-6 text-xs">메뉴를 눌러 주문에 담아주세요</div>';
  } else {
    list.innerHTML = entries.map(([id, qty]) => {
      const { name, price } = menuInfo(id);
      return `
        <div class="flex items-center justify-between py-1.5">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span class="font-medium text-stone-800 truncate">${name}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1">
              <button class="qty-btn w-6 h-6 rounded bg-amber-100 text-amber-900 font-bold hover:bg-amber-200" data-id="${id}" data-action="dec">−</button>
              <span class="w-6 text-center font-bold text-stone-800">${qty}</span>
              <button class="qty-btn w-6 h-6 rounded bg-amber-100 text-amber-900 font-bold hover:bg-amber-200" data-id="${id}" data-action="inc">+</button>
            </div>
            <span class="font-bold text-stone-700 w-16 text-right">${fmt(price * qty)}원</span>
          </div>
        </div>`;
    }).join('');
    list.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', (e) => {
      const id = b.dataset.id;
      if (b.dataset.action === 'inc') cart[id]++;
      else { cart[id]--; if (cart[id] <= 0) delete cart[id]; }
      renderCart();
    }));
  }
  document.getElementById('totalAmount').textContent = fmt(cartTotal());
  document.getElementById('itemCount').textContent = cartItemCount();
  chargeBtn.disabled = cartTotal() <= 0;
}

document.querySelectorAll('.menu-card').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.menuId;
  cart[id] = (cart[id] || 0) + 1;
  b.classList.add('pop');
  setTimeout(() => b.classList.remove('pop'), 250);
  renderCart();
}));

document.getElementById('clearCart').addEventListener('click', () => {
  if (cartItemCount() === 0) return;
  cart = {};
  renderCart();
});

function showState(which) {
  emptyState.classList.toggle('hidden', which !== 'empty');
  qrState.classList.toggle('hidden', which !== 'qr');
  paidState.classList.toggle('hidden', which !== 'paid');
  qrState.classList.toggle('flex', which === 'qr');
  paidState.classList.toggle('flex', which === 'paid');
}

function setBadge(text, cls) {
  statusBadge.className = 'text-xs px-2 py-1 rounded-full ' + cls;
  statusBadge.textContent = text;
}

chargeBtn.addEventListener('click', async () => {
  const amount = cartTotal();
  if (amount <= 0) return;
  chargeBtn.disabled = true;
  try {
    const orderItems = Object.entries(cart).filter(([_, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
    const res = await fetch('/api/order', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ amount, memo: cartMemo(), items: orderItems, base: location.origin })
    });
    const data = await res.json();
    currentOrderId = data.order_id;

    document.getElementById('qrImg').src = data.qr;
    document.getElementById('qrAmount').textContent = fmt(data.amount);
    document.getElementById('qrMemo').textContent = data.memo || '';
    document.getElementById('qrOrderId').textContent = data.order_id;
    document.getElementById('openLink').href = data.pay_url;

    showState('qr');
    setBadge('결제 대기 중…', 'bg-amber-100 text-amber-800');

    if (ws) ws.close();
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${wsProto}://${location.host}/ws/order/${data.order_id}`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'paid') {
        const o = msg.order;
        document.getElementById('paidAmount').textContent = fmt(o.amount);
        document.getElementById('paidPayer').textContent = o.payer_name || '손님';
        document.getElementById('paidMethod').textContent = ({card:'카드', bank:'계좌이체', point:'포인트'}[o.method] || '카드');
        document.getElementById('paidAt').textContent = (o.paid_at || '').replace('T',' ');
        showState('paid');
        setBadge('결제 완료', 'bg-emerald-100 text-emerald-700');
      } else if (msg.type === 'cancelled') {
        setBadge('취소됨', 'bg-rose-100 text-rose-700');
      }
    };
  } catch (err) {
    alert('주문 생성 실패: ' + err);
    chargeBtn.disabled = false;
  }
});

document.getElementById('cancelBtn').addEventListener('click', async () => {
  if (!currentOrderId) return;
  await fetch(`/api/order/${currentOrderId}/cancel`, {method:'POST'});
  showState('empty');
  setBadge('대기', 'bg-stone-100 text-stone-500');
  if (ws) ws.close();
});

document.getElementById('newOrder').addEventListener('click', () => {
  cart = {}; currentOrderId = null;
  renderCart();
  showState('empty');
  setBadge('대기', 'bg-stone-100 text-stone-500');
});

renderCart();
</script>
</body>
</html>
