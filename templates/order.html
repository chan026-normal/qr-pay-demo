<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>{{ store_name }} · 선주문</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5C3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="coconut.kim">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #C99068 0%, #8B5A2B 55%, #4A2C1A 100%);
    background-attachment: fixed;
  }
  .fade-in { animation: fade .3s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { 0%{transform:scale(.96)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
</style>
</head>
<body class="min-h-screen text-white">
<div class="max-w-md mx-auto min-h-screen flex flex-col p-5">

  <header class="flex items-center justify-between py-3">
    <div class="flex items-center gap-2 text-sm opacity-90">
      <div class="w-7 h-7 rounded-lg bg-white/20 grid place-items-center font-black">K</div>
      <span>킴페이 · <span data-i18n="brand_sub">선주문</span></span>
    </div>
    <div class="flex items-center gap-2">
      <button id="installBtn" class="hidden px-3 py-1.5 rounded-full bg-white text-amber-900 font-bold text-xs" data-i18n="install">📲 앱 설치</button>
      <select id="langSel" class="bg-white/15 text-white text-xs rounded-lg px-2 py-1.5 outline-none border border-white/20"></select>
    </div>
  </header>

  <div class="mt-2">
    <div class="text-2xl font-black">{{ store_name }}</div>
    <div class="text-sm opacity-80 mt-0.5" data-i18n="order_title">미리 주문하고 픽업하세요</div>
  </div>

  <!-- 메뉴 -->
  <div class="mt-5 space-y-2">
    {% for item in menu %}
    <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/15 flex items-center gap-3">
      <div class="text-3xl">{{ item.emoji }}</div>
      <div class="flex-1 min-w-0">
        <div class="font-bold menu-name" data-id="{{ item.id }}">{{ item.name }}</div>
        <div class="text-sm opacity-80 menu-price" data-price="{{ item.price }}"></div>
      </div>
      <div class="flex items-center gap-2">
        <button class="qty-btn w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 font-bold text-lg" data-id="{{ item.id }}" data-action="dec">−</button>
        <span class="qty-display w-6 text-center font-bold" data-id="{{ item.id }}">0</span>
        <button class="qty-btn w-8 h-8 rounded-full bg-white text-amber-900 hover:bg-amber-50 font-bold text-lg" data-id="{{ item.id }}" data-action="inc">+</button>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- 결제 영역 -->
  <div class="mt-6 bg-white/10 backdrop-blur rounded-2xl p-5 border border-white/15">
    <div class="text-sm font-semibold mb-2" data-i18n="pay_method">결제 수단</div>
    <div id="methods" class="grid grid-cols-3 gap-2 mb-4">
      <button data-method="card" class="method active py-3 rounded-xl bg-white text-amber-900 font-bold text-sm" data-i18n="m_card">카드</button>
      <button data-method="bank" class="method py-3 rounded-xl bg-white/10 border border-white/20 font-semibold text-sm" data-i18n="m_bank">계좌이체</button>
      <button data-method="point" class="method py-3 rounded-xl bg-white/10 border border-white/20 font-semibold text-sm" data-i18n="m_point">포인트</button>
    </div>
    <label class="text-sm opacity-80" data-i18n="name_label">이름 (선택)</label>
    <input id="payerName" maxlength="20" data-i18n-ph="name_ph"
           class="mt-1 w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 outline-none placeholder-white/40 focus:border-white/60 text-sm" />
  </div>

  <div class="mt-auto pt-6 sticky bottom-0">
    <button id="payBtn" disabled
            class="w-full py-4 rounded-2xl bg-white text-amber-900 text-lg font-black hover:bg-amber-50 active:scale-[.99] transition disabled:opacity-40 disabled:cursor-not-allowed">
      <span id="payLabel">···</span>
      <span id="paySpin" class="hidden inline-block w-5 h-5 border-2 border-amber-900 border-t-transparent rounded-full spin align-middle ml-2"></span>
    </button>
    <div class="text-center text-xs opacity-70 mt-3 mb-2" data-i18n="mock_note">시연용 모의 결제 · 실제 금액 청구 없음</div>
  </div>
</div>

<!-- 설치 안내 시트 -->
<div id="installSheet" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
  <div class="bg-white text-stone-800 rounded-t-3xl w-full max-w-md p-6 fade-in">
    <div class="w-10 h-1 bg-stone-300 rounded-full mx-auto mb-4"></div>
    <div class="text-lg font-black mb-3" data-i18n="install">📲 앱 설치</div>
    <div id="installSteps" class="text-sm whitespace-pre-line leading-relaxed text-stone-600"></div>
    <button id="installClose" class="mt-5 w-full py-3 rounded-xl bg-stone-900 text-white font-bold">OK</button>
  </div>
</div>

<script>
const MENU = {{ menu|tojson }};
const priceById = Object.fromEntries(MENU.map(m => [m.id, m.price]));
const menuById = Object.fromEntries(MENU.map(m => [m.id, m]));
let cart = {};
let selectedMethod = 'card';

// ── 언어 ──
function getLang(){
  const saved = localStorage.getItem('cocokim_lang');
  if (saved) return saved;       // 손님이 직접 고른 언어는 기억
  return 'vi';                   // 기본(첫 화면) 언어: 베트남어
}
let LANG = getLang();
function t(k){ return (window.I18N[LANG] && window.I18N[LANG][k]) || window.I18N.ko[k] || k; }
function priceFmt(n){ return LANG === 'ko' ? n.toLocaleString('ko-KR') + '원' : '₩' + n.toLocaleString('en-US'); }
function menuName(id){ const m = menuById[id]; return (m.i18n && m.i18n[LANG]) || m.name; }

function applyLang(lang){
  LANG = lang;
  localStorage.setItem('cocokim_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('.menu-name').forEach(el => el.textContent = menuName(el.dataset.id));
  document.querySelectorAll('.menu-price').forEach(el => el.textContent = priceFmt(Number(el.dataset.price)));
  const sel = document.getElementById('langSel'); if (sel) sel.value = lang;
  refresh();
}

const langSel = document.getElementById('langSel');
langSel.innerHTML = window.LANGS.map(l => `<option value="${l.code}">${l.flag} ${l.label}</option>`).join('');
langSel.addEventListener('change', e => applyLang(e.target.value));

function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function total(){ return Object.entries(cart).reduce((s,[id,q]) => s + priceById[id]*q, 0); }
function count(){ return Object.values(cart).reduce((s,q)=>s+q,0); }

function refresh(){
  document.querySelectorAll('.qty-display').forEach(el => { el.textContent = cart[el.dataset.id] || 0; });
  const payBtn = document.getElementById('payBtn');
  const label = document.getElementById('payLabel');
  if (count() === 0){ payBtn.disabled = true; label.textContent = t('btn_empty'); }
  else { payBtn.disabled = false; label.textContent = t('btn_order').replace('%s', priceFmt(total())); }
}

document.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.id;
  if (b.dataset.action === 'inc'){ cart[id] = (cart[id]||0)+1; b.classList.add('pop'); setTimeout(()=>b.classList.remove('pop'),250); }
  else { cart[id] = Math.max(0,(cart[id]||0)-1); if(cart[id]===0) delete cart[id]; }
  refresh();
}));

document.querySelectorAll('.method').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.method').forEach(x => {
    x.classList.remove('active','bg-white','text-amber-900');
    x.classList.add('bg-white/10','border','border-white/20');
  });
  b.classList.add('active','bg-white','text-amber-900');
  b.classList.remove('bg-white/10','border','border-white/20');
  selectedMethod = b.dataset.method;
}));

document.getElementById('payBtn').addEventListener('click', async () => {
  if (count() === 0) return;
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  document.getElementById('payLabel').textContent = t('btn_processing');
  document.getElementById('paySpin').classList.remove('hidden');
  try {
    const items = Object.entries(cart).map(([id,qty]) => ({id, qty}));
    const res = await fetch('/api/preorder', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items, method: selectedMethod, payer_name: document.getElementById('payerName').value, base: location.origin })
    });
    if (!res.ok) throw new Error((await res.json()).detail || 'error');
    const data = await res.json();
    location.href = data.track_url;
  } catch(e){
    alert(e.message);
    btn.disabled = false;
    document.getElementById('payLabel').textContent = t('btn_retry');
    document.getElementById('paySpin').classList.add('hidden');
  }
});

applyLang(LANG);

// ── PWA ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInApp = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|; wv\)/i.test(navigator.userAgent);
const isSamsung = /SamsungBrowser/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { if (installBtn) installBtn.classList.add('hidden'); });

function installGuide(){
  if (isInApp) return t('inapp_guide');
  if (isSamsung) return t('samsung_guide');   // 삼성 인터넷 → Chrome 권장
  return isIOS ? t('ios_guide') : t('android_guide');
}
function showInstallSheet(){
  document.getElementById('installSteps').textContent = installGuide();
  document.getElementById('installSheet').classList.remove('hidden');
}
const installClose = document.getElementById('installClose');
if (installClose) installClose.addEventListener('click', () => document.getElementById('installSheet').classList.add('hidden'));

if (installBtn){
  if (!isStandalone) installBtn.classList.remove('hidden');  // 항상 표시 (앱 실행 중이 아닐 때)
  installBtn.addEventListener('click', async () => {
    if (isInApp || isSamsung) { showInstallSheet(); return; }  // 차단 가능 → 안내 먼저
    if (deferredPrompt){
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === 'accepted') installBtn.classList.add('hidden');
    } else {
      showInstallSheet();
    }
  });
}
</script>
</body>
</html>
