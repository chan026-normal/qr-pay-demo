<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>{{ store_name }} · 결제</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Pretendard', system-ui, -apple-system, sans-serif; }
  .fade-in { animation: fade .3s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .check { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .6s ease forwards .2s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-indigo-800 min-h-screen text-white">
<div class="max-w-md mx-auto min-h-screen flex flex-col p-5">

  <header class="flex items-center justify-between py-3 text-sm opacity-90">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-white/20 grid place-items-center font-black">K</div>
      <span>킴페이</span>
    </div>
    <span class="opacity-70">안전 결제 · SSL 모의</span>
  </header>

  <div id="pendingView" class="flex-1 flex flex-col fade-in">
    <div class="mt-6">
      <div class="text-xs uppercase tracking-widest opacity-70">결제 요청</div>
      <div class="text-lg font-bold mt-1">{{ store_name }}</div>
    </div>

    <div class="mt-8 bg-white/10 backdrop-blur rounded-2xl p-6 border border-white/15">
      <div class="text-sm opacity-80">결제 금액</div>
      <div class="text-5xl font-black mt-1">{{ "{:,}".format(order.amount) }}<span class="text-2xl font-bold opacity-80">원</span></div>
      {% if order.memo %}<div class="mt-2 text-sm opacity-90">· {{ order.memo }}</div>{% endif %}
      <div class="mt-4 text-xs opacity-60">주문번호 <span class="font-mono">{{ order.order_id }}</span></div>
    </div>

    <div class="mt-6">
      <div class="text-sm font-semibold mb-2">결제 수단</div>
      <div id="methods" class="grid grid-cols-3 gap-2">
        <button data-method="card" class="method active py-4 rounded-xl bg-white text-slate-900 font-bold">카드</button>
        <button data-method="bank" class="method py-4 rounded-xl bg-white/10 border border-white/20 font-semibold">계좌이체</button>
        <button data-method="point" class="method py-4 rounded-xl bg-white/10 border border-white/20 font-semibold">포인트</button>
      </div>
    </div>

    <div class="mt-4">
      <label class="text-sm opacity-80">이름 (선택)</label>
      <input id="payerName" maxlength="20" placeholder="홍길동"
             class="mt-1 w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 outline-none placeholder-white/40 focus:border-white/60" />
    </div>

    <div class="mt-auto pt-6">
      <button id="payBtn"
              class="w-full py-4 rounded-2xl bg-white text-indigo-700 text-lg font-black hover:bg-slate-100 active:scale-[.99] transition">
        <span id="payLabel">{{ "{:,}".format(order.amount) }}원 결제하기</span>
        <span id="paySpin" class="hidden inline-block w-5 h-5 border-2 border-indigo-700 border-t-transparent rounded-full spin align-middle ml-2"></span>
      </button>
      <div class="text-center text-xs opacity-60 mt-3">이 결제는 시연용 모의 결제입니다 · 실제 금액 청구 없음</div>
    </div>
  </div>

  <div id="doneView" class="hidden flex-1 flex flex-col items-center justify-center text-center">
    <div class="w-28 h-28 rounded-full bg-white grid place-items-center fade-in">
      <svg viewBox="0 0 24 24" class="w-16 h-16" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path class="check" d="M5 12l5 5L20 7"/>
      </svg>
    </div>
    <div class="mt-6 text-2xl font-black">결제가 완료되었습니다</div>
    <div class="mt-1 text-4xl font-black">{{ "{:,}".format(order.amount) }}원</div>
    <div class="mt-1 text-sm opacity-80">{{ store_name }}</div>
    <div class="mt-8 text-xs opacity-60">영수증은 가맹점 화면에서 확인됩니다.</div>
  </div>
</div>

<script>
let selectedMethod = 'card';
document.querySelectorAll('.method').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.method').forEach(x => {
    x.classList.remove('active','bg-white','text-slate-900');
    x.classList.add('bg-white/10','border','border-white/20');
  });
  b.classList.add('active','bg-white','text-slate-900');
  b.classList.remove('bg-white/10','border','border-white/20');
  selectedMethod = b.dataset.method;
}));

const payBtn = document.getElementById('payBtn');
payBtn.addEventListener('click', async () => {
  payBtn.disabled = true;
  document.getElementById('payLabel').textContent = '결제 처리 중';
  document.getElementById('paySpin').classList.remove('hidden');
  try {
    const res = await fetch(`/api/order/{{ order.order_id }}/pay`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        payer_name: document.getElementById('payerName').value,
        method: selectedMethod
      })
    });
    if (!res.ok) throw new Error((await res.json()).detail || '결제 실패');
    document.getElementById('pendingView').classList.add('hidden');
    document.getElementById('doneView').classList.remove('hidden');
    document.getElementById('doneView').classList.add('flex');
  } catch (e) {
    alert(e.message);
    payBtn.disabled = false;
    document.getElementById('payLabel').textContent = '다시 시도';
    document.getElementById('paySpin').classList.add('hidden');
  }
});
</script>
</body>
</html>
