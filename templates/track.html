<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>{{ store_name }} · #{{ order.pickup_number }}</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5C3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="coconut.kim">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #C99068 0%, #8B5A2B 55%, #4A2C1A 100%);
    background-attachment: fixed; transition: background .6s ease;
  }
  body.ready { background: linear-gradient(135deg, #34D399 0%, #059669 55%, #065F46 100%); }
  .fade-in { animation: fade .3s ease-out; }
  @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .bounce { animation: bounce .6s ease; }
  @keyframes bounce { 0%{transform:scale(.8);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body class="min-h-screen text-white">
<div class="max-w-md mx-auto min-h-screen flex flex-col p-6">

  <header class="flex items-center justify-between py-3 text-sm opacity-90">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-white/20 grid place-items-center font-black">K</div>
      <span>킴페이 · {{ store_name }}</span>
    </div>
    <select id="langSel" class="bg-white/15 text-white text-xs rounded-lg px-2 py-1.5 outline-none border border-white/20"></select>
  </header>

  <!-- 픽업 번호 -->
  <div class="mt-6 text-center fade-in">
    <div class="text-sm uppercase tracking-widest opacity-70" data-i18n="pickup_number">픽업 번호</div>
    <div class="text-7xl font-black mt-1 pulse">#{{ order.pickup_number }}</div>
    <div class="text-sm opacity-80 mt-1"><span data-i18n="paid_done">결제 완료</span> · <span id="paidAmt"></span></div>
  </div>

  <!-- 상태 배너 -->
  <div class="mt-6 bg-white/12 backdrop-blur rounded-2xl p-5 text-center border border-white/15">
    <div id="statusBig" class="text-2xl font-black">···</div>
    <div id="statusSub" class="text-sm opacity-80 mt-1"></div>
  </div>

  <!-- 진행 단계 -->
  <div class="mt-6 grid grid-cols-4 gap-2 text-center text-xs">
    <div class="step" data-step="received">
      <div class="dot w-9 h-9 mx-auto rounded-full grid place-items-center font-bold bg-white/15">1</div>
      <div class="mt-1 opacity-80" data-i18n="step1">접수</div>
    </div>
    <div class="step" data-step="preparing">
      <div class="dot w-9 h-9 mx-auto rounded-full grid place-items-center font-bold bg-white/15">2</div>
      <div class="mt-1 opacity-80" data-i18n="step2">준비중</div>
    </div>
    <div class="step" data-step="ready">
      <div class="dot w-9 h-9 mx-auto rounded-full grid place-items-center font-bold bg-white/15">3</div>
      <div class="mt-1 opacity-80" data-i18n="step3">준비완료</div>
    </div>
    <div class="step" data-step="picked_up">
      <div class="dot w-9 h-9 mx-auto rounded-full grid place-items-center font-bold bg-white/15">4</div>
      <div class="mt-1 opacity-80" data-i18n="step4">수령</div>
    </div>
  </div>

  <!-- 주문 내역 -->
  <div class="mt-6 bg-white/10 backdrop-blur rounded-2xl p-5 border border-white/15">
    <div class="text-sm font-semibold mb-2 opacity-90" data-i18n="order_items">주문 내역</div>
    <div id="itemList" class="space-y-1 text-sm"></div>
    <div class="border-t border-white/15 mt-3 pt-3 flex justify-between font-bold">
      <span data-i18n="total">합계</span><span id="totalAmt"></span>
    </div>
  </div>

  <div class="mt-auto pt-6 text-center text-xs opacity-60"><span data-i18n="order_no">주문번호</span> <span class="font-mono">{{ order.order_id }}</span></div>
</div>

<script>
const ORDER_ID = "{{ order.order_id }}";
const ITEMS = {{ order.items|tojson }};
const AMOUNT = {{ order.amount }};
const MENU = {{ menu|tojson }};
const menuById = Object.fromEntries(MENU.map(m => [m.id, m]));
const FLOW = ["received","preparing","ready","picked_up"];

// ── 언어 ──
function getLang(){
  const saved = localStorage.getItem('cocokim_lang');
  if (saved) return saved;
  const codes = window.LANGS.map(l => l.code);
  const nav = (navigator.language || 'ko').slice(0,2);
  return codes.includes(nav) ? nav : 'ko';
}
let LANG = getLang();
let currentStatus = "{{ order.pickup_status or 'received' }}";
function t(k){ return (window.I18N[LANG] && window.I18N[LANG][k]) || window.I18N.ko[k] || k; }
function priceFmt(n){ return LANG === 'ko' ? n.toLocaleString('ko-KR') + '원' : '₩' + n.toLocaleString('en-US'); }
function menuName(it){ const m = menuById[it.id]; return (m && m.i18n && m.i18n[LANG]) || it.name; }

function renderItems(){
  document.getElementById('itemList').innerHTML = ITEMS.map(it =>
    `<div class="flex justify-between"><span class="opacity-90">${menuName(it)} <span class="opacity-60">x${it.qty}</span></span><span class="opacity-90">${priceFmt(it.price*it.qty)}</span></div>`
  ).join('');
  document.getElementById('totalAmt').textContent = priceFmt(AMOUNT);
  document.getElementById('paidAmt').textContent = priceFmt(AMOUNT);
}

function renderStatus(status){
  currentStatus = status;
  const idx = FLOW.indexOf(status);
  document.querySelectorAll('.step').forEach(step => {
    const sIdx = FLOW.indexOf(step.dataset.step);
    const dot = step.querySelector('.dot');
    dot.classList.remove('bg-white/15','bg-white','text-amber-900');
    if (sIdx < idx){ dot.classList.add('bg-white','text-amber-900'); dot.textContent = '✓'; }
    else if (sIdx === idx){ dot.classList.add('bg-white','text-amber-900'); dot.textContent = String(sIdx+1); }
    else { dot.classList.add('bg-white/15'); dot.textContent = String(sIdx+1); }
  });
  const key = {received:'st_received', preparing:'st_preparing', ready:'st_ready', picked_up:'st_pickedup'}[status] || 'st_received';
  const big = document.getElementById('statusBig');
  big.textContent = t(key + '_big');
  document.getElementById('statusSub').textContent = t(key + '_sub');
  big.classList.remove('bounce'); void big.offsetWidth; big.classList.add('bounce');
  document.body.classList.toggle('ready', status === 'ready');
  if (status === 'ready' && navigator.vibrate) navigator.vibrate([200,100,200]);
}

function applyLang(lang){
  LANG = lang;
  localStorage.setItem('cocokim_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  renderItems();
  renderStatus(currentStatus);
  const sel = document.getElementById('langSel'); if (sel) sel.value = lang;
}

const langSel = document.getElementById('langSel');
langSel.innerHTML = window.LANGS.map(l => `<option value="${l.code}">${l.flag} ${l.label}</option>`).join('');
langSel.addEventListener('change', e => applyLang(e.target.value));
applyLang(LANG);

// ── 실시간 상태 ──
const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;
function connect(){
  ws = new WebSocket(`${wsProto}://${location.host}/ws/order/${ORDER_ID}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if ((msg.type === 'status' || msg.type === 'snapshot') && msg.order && msg.order.pickup_status){
      renderStatus(msg.order.pickup_status);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
